<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfbf7">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>澳大利亚 · 10 天 9 晚</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root { --bg:#fdfbf7; --card:#fff; --ink:#262220; --muted:#9a8f86;
          --accent:#b45309; --line:#efe8dd; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:560px; margin:0 auto; padding-bottom:56px; }
  header { padding:30px 20px 0; }
  .title { font-size:23px; font-weight:600; letter-spacing:-.02em; }
  .sub { font-size:12.5px; color:var(--muted); margin-top:6px; }
  .prog { font-size:11px; color:var(--muted); margin-top:18px; }
  .tabs { display:flex; gap:5px; overflow-x:auto; padding:14px 20px 12px; margin-top:12px;
    border-bottom:1px solid var(--line); scrollbar-width:none;
    position:sticky; top:0; background:var(--bg); z-index:5; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 56px; border:1px solid var(--line); background:var(--card);
    border-radius:8px; padding:6px 0 5px; text-align:center; cursor:pointer; }
  .tab .d { font-size:11.5px; font-weight:600; line-height:1.1; letter-spacing:-.01em; }
  .tab .w { font-size:7.5px; color:var(--muted); margin-top:1px; line-height:1.15; }
  .tab .city { font-size:8px; color:var(--muted); margin-top:1px; line-height:1.15; }
  .tab.on { background:var(--accent); border-color:var(--accent); }
  .tab.on .d { color:#fff; } .tab.on .w { color:#f0d9c4; }
  .tab.on .city { color:#f0d9c4; }
  .tab.pending .d { color:var(--muted); }
  .dayhead { padding:22px 20px 8px; }
  .dayhead .dt { font-size:17px; font-weight:600; }
  .dayhead .dc { font-size:11px; color:var(--muted); margin-top:4px; line-height:1.6; }
  .body { padding:6px 20px 20px; }
  .item { display:grid; grid-template-columns:46px 1px 1fr; column-gap:16px; }
  .t { font-size:11px; color:var(--muted); padding-top:5px; text-align:right;
    font-variant-numeric:tabular-nums; }
  .rail { background:var(--line); }
  .c { padding-bottom:24px; }
  .item:last-child .c { padding-bottom:4px; }
  .name { font-size:15.5px; font-weight:500; line-height:1.4; }
  .hi { font-size:12.5px; color:#8a8078; margin-top:6px; line-height:1.65; }
  .intro { font-size:12.5px; color:#8a8078; margin-top:8px; line-height:1.72; }
  .hero { margin-top:12px; width:100%; aspect-ratio:21/9; object-fit:cover;
    border-radius:10px; display:block; background:var(--line); }
  .hero-ph { margin-top:12px; width:100%; aspect-ratio:21/9; border-radius:10px;
    border:1px dashed #e2d8c9; background:#faf7f2; display:flex; align-items:center;
    justify-content:center; font-size:11px; color:#c4b8a8; letter-spacing:.06em; }
  .cost { border-top:1px solid var(--line); padding:16px 20px; display:flex;
    justify-content:space-between; align-items:baseline; }
  .cost .k { font-size:12px; color:var(--muted); }
  .cost .v { font-size:21px; font-weight:600; color:var(--accent); }
  .mapsection { padding:18px 20px 22px; border-top:1px solid var(--line); }
  .meals { padding:18px 20px 20px; border-top:1px solid var(--line); }
  .mcard { background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:12px 13px; margin-bottom:9px; }
  .mcard.picked { border-color:var(--accent); background:#fffaf5; }
  .mhead { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .mname { font-size:13.5px; font-weight:600; }
  .mprice { font-size:11.5px; color:var(--accent); font-weight:600; flex:none; }
  .mtag { font-size:10px; color:var(--muted); margin-top:3px; }
  .mwhy { font-size:11.5px; color:#8a8078; margin-top:6px; line-height:1.6; }
  .mact { margin-top:9px; }
  .mbtn { font-size:11.5px; border:1px solid var(--line); background:#fff;
    color:var(--accent); border-radius:7px; padding:6px 12px; cursor:pointer; font-family:inherit; }
  .mbtn.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mbtn.ghost { color:var(--muted); margin-left:7px; }
  .maplabel { font-size:11px; color:var(--muted); letter-spacing:.08em; margin-bottom:10px; }
  .map { width:100%; height:250px; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:#f2ece3; z-index:1; }
  .map-note { font-size:10.5px; color:var(--muted); margin-top:9px; line-height:1.7; }
  .pin { background:transparent; border:none; }
  .pin span { display:flex; align-items:center; justify-content:center; width:22px; height:22px;
    border-radius:50%; background:var(--accent); color:#fff; font-size:11px; font-weight:600;
    border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.28); }
  .pin.approx span { background:#9a8f86; }
  .leaflet-popup-content { font-size:12px; margin:8px 10px; line-height:1.6; }
  .leaflet-container { font-family:inherit; }
  .item.clickable .name { cursor:pointer; }
  .item.clickable .name::after { content:" ⌄"; color:#c9beb2; font-size:11px; }
  .item.open .name::after { content:" ⌃"; }
  .item .leg { display:none; }
  .item.open .leg { display:block; }
  .leg { margin-top:11px; padding:13px 14px; background:#fff; border:1px solid var(--line);
    border-radius:10px; }
  .leg .from { font-size:11px; color:var(--muted); margin-bottom:9px; }
  .leg .opt { display:flex; gap:10px; align-items:baseline; padding:7px 0; border-top:1px solid #f6f1e9; }
  .leg .opt:first-of-type { border-top:none; padding-top:2px; }
  .leg .badge { flex:none; font-size:9px; color:#fff; background:var(--accent); border-radius:4px;
    padding:2px 6px; letter-spacing:.04em; }
  .leg .opt.taxi .badge { background:#4a5f78; }
  .leg .body { flex:1; }
  .leg .mode { font-size:12.5px; font-weight:500; }
  .leg .det { font-size:11px; color:#8a8078; margin-top:3px; line-height:1.6; }
  .leg .price { flex:none; font-size:12.5px; font-weight:600; color:var(--accent); }
  .leg .opt.taxi .price { color:#4a5f78; }
  .empty { margin:36px 20px; padding:34px 22px; border:1px dashed var(--line);
    border-radius:14px; text-align:center; background:#fff; }
  .empty .big { font-size:15px; font-weight:600; }
  .empty p { font-size:12.5px; color:var(--muted); line-height:1.9; margin:10px 0 0; }
  .note { margin:28px 20px 0; padding:16px; background:#fff; border:1px solid var(--line);
    border-radius:12px; font-size:12px; line-height:1.85; color:#8a8078; }
  .note b { color:var(--ink); }
  .note + .note { margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title" id="tripTitle"></div>
    <div class="sub" id="tripSub"></div>
    <div class="prog" id="tripProg"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"></div>
</div>

<script>
var T = null;
var current = 4;
var liveMap = null;

function boot() {
  T = window.TRIP;
  if (!T) return;
  document.getElementById("tripTitle").textContent = T.title;
  document.getElementById("tripSub").textContent = T.sub;
  document.getElementById("tripProg").textContent =
    "已规划 " + T.planned + " / " + T.totalDays + " 天 · 待排 " + (T.totalDays - T.planned) + " 天";
  renderTabs();
  renderView();
}

function dayLabel(day) { return day.m + "." + day.d + " " + day.w; }

var WEEK = { "一":"星期一","二":"星期二","三":"星期三","四":"星期四","五":"星期五","六":"星期六","日":"星期日" };

function renderTabs() {
  document.getElementById("tabs").innerHTML = T.days.map(function (x) {
    var cls = "tab" + (x.n === current ? " on" : "") + (x.state === "empty" && x.n !== current ? " pending" : "");
    return '<div class="' + cls + '" data-n="' + x.n + '">' +
      '<div class="d">' + x.m + "/" + x.d + '</div>' +
      '<div class="w">' + (WEEK[x.w] || x.w) + '</div>' +
      '<div class="city">' + x.city + '</div></div>';
  }).join("");
}

function legHTML(it) {
  var g = it.leg;
  var out = '<div class="from">从上一站「' + g.from + '」过来' +
    (g.km ? ' · 约 ' + g.km + ' 公里' : '') + '</div>';
  var multi = g.options.length > 1;
  g.options.forEach(function (o, i) {
    out += '<div class="opt ' + (o.kind || "") + '">' +
      (multi ? '<span class="badge">方案' + (i + 1) + '</span>' : '') +
      '<div class="body"><div class="mode">' + o.mode + '</div>' +
      (o.detail ? '<div class="det">' + o.detail + '</div>' : '') + '</div>' +
      '<span class="price">' + o.cost + '</span></div>';
  });
  return out;
}

function itemHTML(it) {
  var isSpot = !!it.intro;
  var media = "";
  if (isSpot && !it.noPhoto) {
    media = it.img
      ? '<img class="hero" src="' + it.img + '" loading="lazy" alt="' + it.name + '">'
      : '<div class="hero-ph">配图待补</div>';
  }
  var leg = it.leg ? '<div class="leg">' + legHTML(it) + '</div>' : '';
  return '<div class="item' + (it.leg ? ' clickable' : '') + '">' +
    '<div class="t">' + it.t + '</div><div class="rail"></div>' +
    '<div class="c"><div class="name">' + it.name + '</div>' +
    (it.hi ? '<div class="hi">' + it.hi + '</div>' : '') +
    (it.intro ? '<div class="intro">' + it.intro + '</div>' : '') +
    media + leg + '</div></div>';
}

/* ------------------------- 餐厅 ------------------------- */
var picked = {};   // { 天数: { lunch: 索引, dinner: 索引 } }

function pickOf(day, code) {
  var p = picked[day.n];
  return p && p[code] != null ? p[code] : null;
}

function kmBetween(a, b) {
  if (!a || !b) return null;
  var R = 6371, rad = Math.PI / 180;
  var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

// 把选中的餐厅插进行程，并算出从上一站过去的交通
function itemsForDay(day) {
  var items = day.items.map(function (x) { return x; });
  ["lunch", "dinner"].forEach(function (code) {
    var idx = pickOf(day, code);
    if (idx == null || !day.meals || !day.meals[code] || !day.meals[code][idx]) return;
    var r = day.meals[code][idx];
    var target = code === "lunch" ? 12 * 60 : 19 * 60;
    // 有专门的用餐行就替换它，否则按时间插进去
    var slotAt = -1;
    for (var k = 0; k < items.length; k++) {
      if (items[k].slot === code) { slotAt = k; break; }
    }
    var at = items.length;
    for (var i = 0; i < items.length; i++) {
      var m = /(\d{1,2}):(\d{2})/.exec(items[i].t || "");
      if (m) {
        var mins = Number(m[1]) * 60 + Number(m[2]);
        if (mins >= target) { at = i; break; }
      }
    }
    var pos = slotAt >= 0 ? slotAt : at;
    var prev = pos > 0 ? items[pos - 1] : null;
    var km = prev ? kmBetween(prev.ll, r.ll) : null;
    var leg = null;
    if (km != null) {
      var round = Math.round(km * 10) / 10;
      var walk = Math.max(2, Math.round(km * 12));
      leg = {
        from: prev.name, km: round,
        options: km < 1
          ? [{ mode: "步行", detail: "约 " + walk + " 分钟", cost: "A$0" }]
          : [{ mode: "步行", detail: "约 " + walk + " 分钟", cost: "A$0" },
             { mode: "打车 / Uber", detail: "约 " + Math.max(3, Math.round(km * 3)) + " 分钟",
               cost: "A$" + (6 + Math.round(km * 2)), kind: "taxi" }]
      };
    }
    var row = {
      t: code === "lunch" ? "12:00" : "19:00",
      name: r.n, hi: r.t + " · " + r.p, ll: r.ll, leg: leg, meal: true
    };
    if (slotAt >= 0) items.splice(slotAt, 1, row);
    else items.splice(at, 0, row);
  });
  return items;
}

function mealsHTML(day) {
  if (!day.meals) return "";
  var pickedOf = picked[day.n] || {};
  function group(code, title) {
    var list = day.meals[code];
    if (!list) return "";
    return '<div class="maplabel">' + title + '</div>' + list.map(function (r, i) {
      var on = pickedOf[code] === i;
      return '<div class="mcard' + (on ? " picked" : "") + '">' +
        '<div class="mhead"><span class="mname">' + r.n + '</span><span class="mprice">' + r.p + '</span></div>' +
        '<div class="mtag">' + r.t + '</div>' +
        '<div class="mwhy">' + r.w + '</div>' +
        '<div class="mact">' +
        (on
          ? '<button class="mbtn on" data-mclear="' + code + '">已加入行程</button>' +
            '<button class="mbtn ghost" data-mclear="' + code + '">换一家</button>'
          : '<button class="mbtn" data-madd="' + code + '" data-idx="' + i + '">加入行程</button>') +
        '</div></div>';
    }).join("");
  }
  return '<div class="meals">' + group("lunch", "午餐推荐 · 三选一") +
    '<div style="height:14px"></div>' + group("dinner", "晚餐推荐 · 三选一") + '</div>';
}

function mapHTML(day) {
  var pts = day.items.filter(function (it) { return it.ll; });
  if (pts.length < 2) return "";
  var approx = pts.some(function (p) { return p.approx; });
  return '<div class="mapsection"><div class="maplabel">当日动线</div>' +
    '<div class="map" id="daymap"></div>' +
    '<div class="map-note">编号对应上面的行程顺序。' +
    (approx ? '灰色标记表示位置是估算的。' : '') +
    '</div></div>';
}

function initMap(day) {
  var el = document.getElementById("daymap");
  if (!el) return;
  if (typeof L === "undefined") {
    el.innerHTML = '<div style="padding:20px;font-size:12px;color:#9a8f86">地图库没加载出来，检查网络后刷新。</div>';
    return;
  }
  var pts = day.items.filter(function (it) { return it.ll; });
  var map = L.map(el, { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, attribution: "Esri" }
  ).addTo(map);
  var latlngs = pts.map(function (p) { return p.ll; });
  if (latlngs.length > 1) {
    L.polyline(latlngs, { color: "#b45309", weight: 3, opacity: 0.8 }).addTo(map);
  }
  pts.forEach(function (p, i) {
    var icon = L.divIcon({
      className: "pin" + (p.approx ? " approx" : ""),
      html: "<span>" + (i + 1) + "</span>",
      iconSize: [22, 22], iconAnchor: [11, 11]
    });
    L.marker(p.ll, { icon: icon }).addTo(map)
      .bindPopup("<b>" + p.t + " " + p.name + "</b>");
  });
  var b = L.latLngBounds(latlngs);
  map.fitBounds(b.pad(0.12));
  liveMap = map;
}

function renderView() {
  var day = T.days.filter(function (x) { return x.n === current; })[0];
  var v = document.getElementById("view");
  if (day.state === "empty") {
    v.innerHTML = '<div class="empty"><div class="big">D' + day.n + ' · ' + dayLabel(day) + ' · ' +
      day.city + '</div><p>这一天还是空的。<br>点别的日期看看已经排好的样子。</p></div>';
    return;
  }
  var head = '<div class="dayhead"><div class="dt">D' + day.n + ' · ' + dayLabel(day) + ' · ' + day.city +
    '</div><div class="dc">' + day.subtitle + '</div></div>';
  var cost = day.cost
    ? '<div class="cost"><span class="k">当日花费</span><span class="v">人均 ≈ ' + day.cost + '</span></div>'
    : "";
  v.innerHTML = head + '<div class="body">' + itemsForDay(day).map(itemHTML).join("") + '</div>' +
    cost + mealsHTML(day) + mapHTML(day);
  if (liveMap) { liveMap.remove(); liveMap = null; }
  initMap(day);
}

document.getElementById("tabs").addEventListener("click", function (e) {
  var el = e.target.closest(".tab");
  if (!el) return;
  current = Number(el.dataset.n);
  renderTabs();
  renderView();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("view").addEventListener("click", function (e) {
  var add = e.target.closest("[data-madd]");
  if (add) {
    var code = add.getAttribute("data-madd");
    var day = T.days.filter(function (x) { return x.n === current; })[0];
    picked[day.n] = picked[day.n] || {};
    picked[day.n][code] = Number(add.getAttribute("data-idx"));
    renderView();
    return;
  }
  var clr = e.target.closest("[data-mclear]");
  if (clr) {
    var c2 = clr.getAttribute("data-mclear");
    var d2 = T.days.filter(function (x) { return x.n === current; })[0];
    if (picked[d2.n]) delete picked[d2.n][c2];
    renderView();
    return;
  }
  var item = e.target.closest(".item.clickable");
  if (!item) return;
  item.classList.toggle("open");
});

// 数据文件用时间戳加载，避免浏览器拿缓存里的旧版本
(function () {
  var s = document.createElement("script");
  s.src = "itinerary.js?t=" + Date.now();
  s.onload = boot;
  s.onerror = function () {
    document.getElementById("view").innerHTML =
      '<div class="empty"><div class="big">行程数据没加载出来</div><p>刷新一次试试。</p></div>';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
